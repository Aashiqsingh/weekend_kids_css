<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 300px;
        width: 300px;
        background-color: gray;


        font-family: 'Courier New', Courier, monospace;
        font-family: cursive;
        color: white;
        font-size: x-large;
        font-size: 20px;

        font-weight: lighter;
        font-style: italic;


        text-align: center;
        text-align: justify;

        text-decoration: underline;
        text-decoration: line-through;
        text-decoration: overline;

        text-decoration: underline blue solid;
        text-decoration: underline blue dotted;
        text-decoration: underline blue dashed;
        text-decoration: underline blue double;
        text-decoration: underline blue wavy;

        text-decoration: overline dotted darkblue;

        text-transform: capitalize;
        /* text-transform: uppercase; */

        
        /* text-shadow: 2px 2px 2px yellow; */
        text-shadow: -2px -2px 1px green;



    }
</style>
<body>

    <div class="box">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus doloribus alias hic et. Asperiores a unde, quae harum error delectus officiis quaerat laudantium nihil sequi, impedit consequuntur ipsum ab voluptatibus!
    </div>
    
</body>
</html>
